name: "Continuous Integration & Container Verification"

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate_container_matrix:
    name: "Run Verification & Linting Tests"
    runs-on: "ubuntu-latest"
    
    steps:
      - name: "Clone Source Code Assets"
        uses: "actions/checkout@v4"

      - name: "Mount Execution Python Environment"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Engineering Evaluation Tools"
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 -r requirements.txt

      - name: "Execute Systematic Verification Suite Tests"
        run: |
          python -m pytest tests/

      - name: "Validate Localized Isolation Build Mechanics"
        run: |
          docker build -t app-preflight-test:local .